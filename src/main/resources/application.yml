server:
  port: ${PORT:8080}

spring:
  application:
    name: sukyo-backend
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sukyo}
    username: ${SPRING_DATASOURCE_USERNAME:sukyo}
    password: ${SPRING_DATASOURCE_PASSWORD:sukyo}
