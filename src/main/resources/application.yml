spring:
  application:
    name: sukyo-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sukyo
    username: sukyo
    password: sukyo

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:sukyo}
    username: ${DB_USER:sukyo}
    password: ${DB_PASSWORD:sukyo}
