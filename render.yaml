databases:
  - name: sukyo-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: sukyo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: DB_HOST
        fromDatabase:
          name: sukyo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sukyo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sukyo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sukyo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sukyo-db
          property: password

